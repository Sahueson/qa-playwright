name: run-tests

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID del run en Supabase"
        required: true
      suite:
        description: "Slug de la suite o varios separados por comas (ej. a-auth,b-eventos)"
        required: true
      grep:
        description: "Opcional: solo estos tests (regex de títulos, separados por |)"
        required: false
        default: ""

jobs:
  test:
    permissions:
      contents: write   # publica el informe en la rama gh-pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
    env:
      RUN_ID: ${{ inputs.run_id }}
      SUITE: ${{ inputs.suite }}
      GREP: ${{ inputs.grep }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      BASE_URL: ${{ secrets.TARGET_BASE_URL }}
      # Reset del staging en global-setup (usuarios QA + seed) y login de los tests.
      STG_URL: ${{ secrets.STG_URL }}
      STG_SECRET_KEY: ${{ secrets.STG_SECRET_KEY }}
      QA_PASSWORD: ${{ secrets.QA_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: Sahueson/ivan-qa-lab-shared
          path: shared

      - run: npm ci

      - name: Dependencias de shared (reset del staging)
        run: npm ci --prefix shared

      - name: Marcar run como en curso
        run: node shared/send-to-supabase.js start

      - name: Ejecutar tests
        run: ./run.sh
        continue-on-error: true

      - name: Enviar resultados
        if: always()
        run: node shared/send-to-supabase.js finish result.json

      # Solo capturas: las trazas incluyen las peticiones de login (contraseña QA y tokens)
      # y los artefactos de un repo público los puede descargar cualquiera.
      - name: Capturas de los tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-${{ inputs.suite }}
          path: test-results/**/*.jpg
          if-no-files-found: ignore
          retention-days: 7

      # Si algo falla antes de tener result.json (npm ci, config, job cancelado...),
      # el run se cierra como 'failed' para no dejar bloqueado el índice one_active_run.
      # Solo afecta a runs aún activos: tras un 'finish' correcto no hace nada.
      # Informe HTML de la ejecución (público en GitHub Pages: sin claves, tokens, contraseñas, emails ni ids de usuario).
      - name: Informe HTML
        if: always()
        continue-on-error: true
        run: node shared/make-report.js result.json report "Informe de Playwright"

      - name: Publicar informe (GitHub Pages)
        if: always() && hashFiles('report/index.html') != ''
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: report
          destination_dir: ${{ inputs.run_id }}
          keep_files: true
          user_name: qa-lab-bot
          user_email: qa-lab-bot@users.noreply.github.com

      - name: Marcar run como fallido
        if: failure() || cancelled()
        run: node shared/send-to-supabase.js fail "El job de GitHub Actions falló o se canceló"