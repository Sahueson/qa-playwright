name: run-tests

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID del run en Supabase"
        required: true
      suite:
        description: "Slug de la suite (ej. a-auth)"
        required: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
    env:
      RUN_ID: ${{ inputs.run_id }}
      SUITE: ${{ inputs.suite }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      BASE_URL: ${{ secrets.TARGET_BASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: Sahueson/ivan-qa-lab-shared
          path: shared

      - run: npm ci

      - name: Marcar run como en curso
        run: node shared/send-to-supabase.js start

      - name: Ejecutar tests
        run: npx playwright test "tests/$SUITE"
        continue-on-error: true

      - name: Enviar resultados
        if: always()
        run: node shared/send-to-supabase.js finish result.json

      # Si algo falla antes de tener result.json (npm ci, config, job cancelado...),
      # el run se cierra como 'failed' para no dejar bloqueado el índice one_active_run.
      # Solo afecta a runs aún activos: tras un 'finish' correcto no hace nada.
      - name: Marcar run como fallido
        if: failure() || cancelled()
        run: node shared/send-to-supabase.js fail "El job de GitHub Actions falló o se canceló"